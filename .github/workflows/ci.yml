name: CI

# Required checks for main (see "Branch protection" in docs/architecture.md):
#   check (ubuntu-latest), check (macos-latest), check (windows-latest):
#     lint, types, the app's tests and a production build on each OS. Students
#     work on macOS and Windows; Vercel builds on Linux.
#   eval: the golden-set evaluation with real models and the Langfuse scores.
on:
  push:
  pull_request:

# A new push to the same branch replaces the run in progress, so an old
# evaluation doesn't keep spending money.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  eval:
    # Real models cost money, so this runs on pull requests and on main, not on
    # every push to a work-in-progress branch.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Repository secrets: Settings > Secrets and variables > Actions. Pull
      # requests from forks don't get them, so the evaluation fails there on
      # purpose rather than passing without running.
      GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
      LANGFUSE_BASE_URL: ${{ secrets.LANGFUSE_BASE_URL }}
      EVAL_REQUIRE_LANGFUSE: "1"
      # The judge. The default (gemini-3-flash, a preview model) runs out of
      # free-tier quota partway through the golden set, and gemini-2.5-flash is
      # closed to new keys, so the judge uses the agents' own Flash-Lite. A
      # model can grade its own kind of answer too kindly, so judge_score is a
      # signal; refund_state, tool_use and policy are checked by code.
      EVAL_JUDGE_MODEL: google/gemini-3.5-flash-lite
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run eval
      - name: Show the results
        if: always()
        run: |
          if [ -f eval-results/summary.md ]; then
            cat eval-results/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The evaluation did not produce a report. See the log above." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: eval-results
          path: eval-results/
          if-no-files-found: ignore
